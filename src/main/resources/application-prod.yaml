spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    baseline-on-migrate: true
    enabled: true

  oauth2:
    client:
      registration:
        google:
          client-id: ${GOOGLE_CLIENT_ID}
          client-secret: ${GOOGLE_CLIENT_SECRET}
          redirect-uri: ${BACKEND_URL}/login/oauth2/code/google
          scope:
            - email
            - profile

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  port: ${PORT:8080}

app:
  frontend-url: ${FRONTEND_URL}
  mail:
    from: ${MAIL_FROM}
    brevo:
      api-key: ${MAIL_PASSWORD}

logging:
  level:
    root: INFO
    com.dseme: INFO
